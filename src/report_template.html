<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZ-PD capture report</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e;
  --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
  --border:rgba(11,11,11,.10); --series-1:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7;
    --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --border:rgba(255,255,255,.10); --series-1:#3987e5;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 20px}
section.capture{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:18px 20px;margin:0 0 22px}
h2{font-size:15px;margin:0;word-break:break-all}
.meta{color:var(--ink-2);font-size:12px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--border);border-radius:999px;padding:1px 9px;
  font-size:12px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.chart-wrap{position:relative;margin:0 0 6px}
.chart-title{font-size:12px;color:var(--ink-2);margin:0 0 4px;font-weight:600}
svg.chart{display:block;width:100%;height:auto;outline:none}
svg.chart:focus-visible{outline:2px solid var(--series-1);outline-offset:2px;border-radius:4px}
.tick text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--surface);
  border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12);
  padding:6px 9px;font-size:12px;display:none;white-space:nowrap;z-index:2}
.tip .v{font-weight:600;font-size:13px}
.tip .v::before{content:"";display:inline-block;width:12px;height:0;
  border-top:2px solid var(--series-1);vertical-align:middle;margin-right:6px}
.tip .d{color:var(--ink-2)}
.controls{display:flex;align-items:center;gap:16px;margin:12px 0 8px;flex-wrap:wrap}
.controls input[type=search]{background:var(--page);color:var(--ink);
  border:1px solid var(--border);border-radius:6px;padding:4px 9px;font:inherit;
  font-size:13px;width:220px}
.controls label{color:var(--ink-2);font-size:13px;display:flex;gap:6px;align-items:center}
.controls .shown{color:var(--muted);font-size:12px;margin-left:auto}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface);color:var(--ink-2);
  text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--axis);
  white-space:nowrap}
td{padding:4px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;
  font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td.num{text-align:right}
th.num{text-align:right}
td.data{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
tr.goodcrc td{color:var(--muted)}
.empty{color:var(--muted);padding:10px;font-size:13px}
tr.expandable{cursor:pointer}
tr.expandable:hover td{background:color-mix(in srgb, var(--series-1) 6%, transparent)}
td .caret{display:inline-block;width:1em;color:var(--muted);
  transition:transform .12s ease}
tr.open td .caret{transform:rotate(90deg)}
tr.decode-row>td{padding:2px 10px 10px 34px;white-space:normal;
  background:color-mix(in srgb, var(--series-1) 4%, transparent)}
ul.dec{list-style:none;margin:4px 0 0;padding:0 0 0 0;font-size:12px}
ul.dec ul.dec{padding-left:18px;border-left:1px solid var(--grid);margin-left:4px}
ul.dec>li{margin:1px 0}
ul.dec .dn{color:var(--ink-2)}
ul.dec .dv{color:var(--ink);font-weight:500;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
ul.dec>li.top>.dn{font-weight:600;color:var(--ink)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 14px;
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  background:color-mix(in srgb, var(--series-1) 4%, transparent);font-size:12.5px}
.summary .sk{color:var(--ink-2);font-weight:600}
.summary .sv{color:var(--ink)}
td.event{white-space:nowrap}
tr.event-row td{background:color-mix(in srgb, var(--series-1) 7%, transparent)}
tr.event-row td.event{font-weight:600}
.decraw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  color:var(--ink-2);margin:4px 0 2px;word-break:break-all}
</style>
</head>
<body>
<h1>EZ-PD capture report</h1>
<p class="sub">Generated by cedar on __STAMP__. VBUS is plotted from
per-packet readings; times are relative to the first packet in each capture.</p>
<main id="app"></main>
<script>
const DATA = __DATA__;

const num = s => {
  const v = parseFloat(String(s ?? "").replace(/,/g, ""));
  return Number.isFinite(v) ? v : null;
};
const fmt = (v, dp = 2) => v.toLocaleString("en-US",
  {minimumFractionDigits: dp, maximumFractionDigits: dp});
const el = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
};
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

function niceTicks(max, n = 5) {
  if (max <= 0) return [0];
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => max / s <= n) || 10 * mag;
  const ticks = [];
  for (let v = 0; ; v += step) {          // last tick always covers max
    ticks.push(v);
    if (v >= max - step * 1e-9) return ticks;
  }
}

function renderChart(wrap, pkts) {
  const pts = pkts
    .map((p, i) => ({t: num(p.sTime), v: num(p.vbus), p, i}))
    .filter(d => d.t !== null && d.v !== null)
    .sort((a, b) => a.t - b.t);
  if (pts.length < 2) {
    wrap.append(el("p", {class: "empty"}, "No VBUS/time data to plot."));
    return;
  }
  const t0 = pts[0].t;
  pts.forEach(d => { d.x = (d.t - t0) / 1e6; d.y = d.v / 1000; });

  const W = 960, H = 220, ml = 46, mr = 14, mt = 12, mb = 30;
  const pw = W - ml - mr, ph = H - mt - mb;
  const xMax = pts[pts.length - 1].x || 1;
  const yTicks = niceTicks(Math.max(...pts.map(d => d.y)));
  const yMax = yTicks[yTicks.length - 1] || 1;
  const X = x => ml + (x / xMax) * pw;
  const Y = y => mt + ph - (y / yMax) * ph;

  const svg = svgEl("svg", {class: "chart", viewBox: `0 0 ${W} ${H}`,
    tabindex: "0", role: "img",
    "aria-label": "VBUS voltage over time; values are in the table below"});

  for (const v of yTicks) {
    const g = svgEl("g", {class: "tick"});
    g.append(svgEl("line", {x1: ml, x2: W - mr, y1: Y(v), y2: Y(v),
      stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1}));
    const t = svgEl("text", {x: ml - 8, y: Y(v) + 3.5, "text-anchor": "end"});
    t.textContent = `${v} V`;
    g.append(t);
    svg.append(g);
  }
  for (const x of niceTicks(xMax, 8)) {
    const g = svgEl("g", {class: "tick"});
    const t = svgEl("text", {x: X(x), y: H - mb + 16, "text-anchor": "middle"});
    t.textContent = `${+x.toFixed(3)} s`;
    g.append(t);
    svg.append(g);
  }

  let line = `M${X(pts[0].x).toFixed(1)} ${Y(pts[0].y).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++)
    line += `H${X(pts[i].x).toFixed(1)}V${Y(pts[i].y).toFixed(1)}`;
  const area = line + `V${Y(0).toFixed(1)}H${X(pts[0].x).toFixed(1)}Z`;
  svg.append(svgEl("path", {d: area, fill: "var(--series-1)", opacity: ".1"}));
  svg.append(svgEl("path", {d: line, fill: "none", stroke: "var(--series-1)",
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));

  const cross = svgEl("line", {y1: mt, y2: mt + ph, stroke: "var(--axis)",
    "stroke-width": 1, visibility: "hidden"});
  const dot = svgEl("circle", {r: 4.5, fill: "var(--series-1)",
    stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden"});
  svg.append(cross, dot);

  const tip = el("div", {class: "tip"});
  const tipV = el("div", {class: "v"}), tipD = el("div", {class: "d"});
  tip.append(tipV, tipD);
  wrap.append(svg, tip);

  let cur = -1;
  const show = i => {
    cur = i;
    const d = pts[i], px = X(d.x), py = Y(d.y);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px);
    cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py);
    dot.setAttribute("visibility", "visible");
    tipV.textContent = `${fmt(d.y)} V`;
    tipD.textContent = `t = ${fmt(d.x, 3)} s · ${d.p.msg || "?"}` +
      (d.p.sop ? ` · ${d.p.sop}` : "");
    tip.style.display = "block";
    const r = svg.getBoundingClientRect(), sx = r.width / W;
    const left = px * sx + 12, flip = left + tip.offsetWidth + 8 > r.width;
    tip.style.left = `${flip ? px * sx - tip.offsetWidth - 12 : left}px`;
    tip.style.top = `${Math.max(0, py * sx - tip.offsetHeight - 10)}px`;
  };
  const hide = () => { cur = -1; tip.style.display = "none";
    cross.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden"); };

  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width * W - ml) / pw * xMax;
    let best = 0;
    for (let i = 1; i < pts.length; i++)
      if (Math.abs(pts[i].x - x) < Math.abs(pts[best].x - x)) best = i;
    show(best);
  });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight") show(Math.min(pts.length - 1, cur + 1));
    else if (ev.key === "ArrowLeft") show(Math.max(0, cur < 0 ? 0 : cur - 1));
    else if (ev.key === "Escape") hide();
    else return;
    ev.preventDefault();
  });
  svg.addEventListener("focus", () => { if (cur < 0) show(0); });
  svg.addEventListener("blur", hide);
}

function renderTable(host, pkts, hasOk) {
  const t0 = Math.min(...pkts.map(p => num(p.sTime)).filter(v => v !== null));
  const cols = [
    ["sno", "sno", "num"], ...(hasOk ? [["ok", "status", ""]] : []),
    ["sop", "SOP", ""], ["msg", "message", ""], ["dRole", "dRole", ""],
    ["pRole", "pRole", ""], ["rev", "rev", ""], ["vbus", "VBUS (mV)", "num"],
    ["sTime", "t (s)", "num"], ["duration", "dur (µs)", "num"],
    ["delta", "delta (µs)", "num"], ["event", "event", "event"],
  ];
  const controls = el("div", {class: "controls"});
  const search = el("input", {type: "search", placeholder: "Filter message / data / role…"});
  const cb = el("input", {type: "checkbox"});
  const cbLabel = el("label"); cbLabel.append(cb, document.createTextNode("Show GOODCRC"));
  const evOnly = el("input", {type: "checkbox"});
  const evLabel = el("label"); evLabel.append(evOnly, document.createTextNode("Only events"));
  const shown = el("span", {class: "shown"});
  controls.append(search, cbLabel, evLabel, shown);

  const wrap = el("div", {class: "tbl-wrap"});
  const table = el("table");
  const thead = el("thead"), hr = el("tr");
  for (const [, label, cls] of cols) hr.append(el("th", cls ? {class: cls} : {}, label));
  thead.append(hr);
  const tbody = el("tbody");
  table.append(thead, tbody);
  wrap.append(table);
  host.append(controls, wrap);

  const decList = (details, top) => {
    const ul = el("ul", {class: "dec"});
    for (const d of details) {
      const li = el("li", top ? {class: "top"} : {});
      li.append(el("span", {class: "dn"}, d.n + ": "),
                el("span", {class: "dv"}, d.v));
      if (d.s && d.s.length) li.append(decList(d.s, false));
      ul.append(li);
    }
    return ul;
  };

  const draw = () => {
    const q = search.value.trim().toLowerCase();
    tbody.replaceChildren();
    let n = 0;
    for (const p of pkts) {
      const isCrc = p.msg === "GOODCRC";
      if (isCrc && !cb.checked) continue;
      if (evOnly.checked && !p.event) continue;
      if (q && ![p.msg, p.data, p.sop, p.dRole, p.pRole, p.ok, p.event]
          .some(v => (v || "").toLowerCase().includes(q))) continue;
      const cls = [isCrc ? "goodcrc" : "", p.event ? "event-row" : ""]
        .filter(Boolean).join(" ");
      const tr = el("tr", cls ? {class: cls} : {});
      let first = true;
      for (const [key, , cls] of cols) {
        let v = p[key] ?? "";
        if (key === "sTime") {
          const t = num(v);
          v = t === null ? "" : fmt((t - t0) / 1e6, 3);
        }
        const td = el("td", cls ? {class: cls} : {});
        if (first && p.dec) td.append(el("span", {class: "caret"}, "▸"));
        td.append(document.createTextNode(v));
        tr.append(td);
        first = false;
      }
      if (p.dec) {
        tr.classList.add("expandable");
        tr.addEventListener("click", () => {
          const open = tr.classList.toggle("open");
          if (open) {
            const dr = el("tr", {class: "decode-row"});
            const td = el("td", {colspan: cols.length});
            if (p.data) td.append(el("div", {class: "decraw"}, "Raw: " + p.data));
            td.append(decList(p.dec, true));
            dr.append(td);
            tr.after(dr);
          } else if (tr.nextSibling?.classList?.contains("decode-row")) {
            tr.nextSibling.remove();
          }
        });
      }
      tbody.append(tr); n++;
    }
    shown.textContent = `${n} of ${pkts.length} packets`;
    if (!n) {
      const tr = el("tr"), td = el("td", {class: "empty", colspan: cols.length},
        "No packets match the current filter.");
      tr.append(td); tbody.append(tr);
    }
  };
  search.addEventListener("input", draw);
  cb.addEventListener("change", draw);
  evOnly.addEventListener("change", draw);
  draw();
}

const app = document.getElementById("app");
for (const ds of DATA) {
  const sec = el("section", {class: "capture"});
  sec.append(el("h2", {}, ds.label));

  const times = ds.pkts.map(p => num(p.sTime)).filter(v => v !== null);
  const span = times.length ? (Math.max(...times) - Math.min(...times)) / 1e6 : 0;
  sec.append(el("p", {class: "meta"},
    `${ds.pkts.length} packets · ${fmt(span, 2)} s span`));

  const counts = new Map();
  for (const p of ds.pkts) {
    const k = p.msg || "?";
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const chips = el("div", {class: "chips"});
  [...counts.entries()].sort((a, b) => b[1] - a[1]).forEach(([msg, n]) => {
    const c = el("span", {class: "chip"});
    c.append(el("b", {}, msg), document.createTextNode(` ×${n}`));
    chips.append(c);
  });
  sec.append(chips);

  if (ds.summary) {
    const panel = el("div", {class: "summary"});
    for (const [k, v] of [["Cable", ds.summary.cable],
                          ["Partner", ds.summary.partner],
                          ["Contract", ds.summary.contract]]) {
      panel.append(el("span", {class: "sk"}, k), el("span", {class: "sv"}, v || "—"));
    }
    sec.append(panel);
  }

  sec.append(el("p", {class: "chart-title"}, "VBUS (V) over time"));
  const wrap = el("div", {class: "chart-wrap"});
  sec.append(wrap);
  renderChart(wrap, ds.pkts);

  const hasOk = ds.pkts.some(p => p.ok);
  renderTable(sec, ds.pkts, hasOk);
  app.append(sec);
}
</script>
</body>
</html>
