[package]
name = "cedar"
version = "0.1.0"
description = "Command-line capture tool for the Cypress/Infineon CY4500 EZ-PD Protocol Analyzer and ChargerLab POWER-Z KM003C"
repository = "https://github.com/FrameworkComputer/cedar"
readme = "README.md"
license = "BSD-3-Clause"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "cedar"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line tool and its libusb/serial capture backends. Disable to
# build the decoding/report library on its own (e.g. for WebAssembly, see web/).
cli = ["dep:rusb", "dep:serialport", "dep:clap", "dep:ctrlc", "dep:env_logger"]

[dependencies]
rusb = { version = "0.9", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }
env_logger = { version = "0.11", optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
anyhow = "1.0"
log = "0.4"
aes = "0.8"
# Without libudev: on Linux, ports are found (with their USB IDs) via sysfs.
serialport = { version = "4.10", default-features = false, optional = true }

# On Windows there is no system libusb, so build the bundled copy from source.
# On Linux/macOS we link the system libusb (installed via the package manager).
[target.'cfg(windows)'.dependencies]
rusb = { version = "0.9", features = ["vendored"], optional = true }

[workspace]
members = ["web"]

[profile.release]
lto = true
