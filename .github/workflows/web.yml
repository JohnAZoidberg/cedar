name: Web UI

# Builds the WebAssembly web UI on every push and pull request, and deploys
# it to GitHub Pages from main. Pages must be set to "GitHub Actions" as its
# source (Settings → Pages).

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Clippy (core library and web bindings, wasm32)
        run: |
          cargo clippy -p cedar --no-default-features --lib --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p cedar-web --target wasm32-unknown-unknown -- -D warnings
      # Trunk fetches the wasm-bindgen CLI matching Cargo.lock by itself.
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin" trunk
      # --public-url must match where Pages serves the site: project pages live
      # under /<repo>/, not at the domain root.
      - name: Build the site
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - name: Check the site's files exist
        run: |
          test -s dist/index.html
          for f in 'app-*.js' 'meter.js' 'style-*.css' 'cedar-web-*.js' 'cedar-web-*_bg.wasm'; do
            ls dist/$f > /dev/null || { echo "missing dist/$f"; exit 1; }
          done
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
